# Standalone pgvector for the consulting semantic graph.
# Isolated from the Obsidian vault stack: its own container, DB, and host port,
# so indexing the consulting folder never touches the vault graph.
#
#   docker compose -f docker-compose.consulting.yml up -d
#
# The explicit project name keeps this stack separate from docker-compose.yml.
name: consulting-graph

services:
  consulting-graph:
    build: .
    image: consulting-graph
    container_name: consulting-graph
    stdin_open: true
    tty: true
    depends_on:
      consulting-pgvector:
        condition: service_healthy
    environment:
      - MCP_SERVER_NAME=consulting-graph
      - CORPUS_PATH=/corpus
      - CORPUS_EXTENSIONS=.md,.markdown,.txt,.pdf,.docx,.pptx,.html,.htm,.csv,.xlsx,.xls
      - OBSIDIAN_WATCH_ENABLED=true
      - OBSIDIAN_DEBOUNCE_SECONDS=${CONSULTING_DEBOUNCE_SECONDS:-10}
      - OBSIDIAN_WATCH_USE_POLLING=true
      - OBSIDIAN_WATCH_POLLING_INTERVAL=${CONSULTING_POLLING_INTERVAL:-30}
      # Primary: OpenRouter qwen3-embedding-8b (~$0.01/M tokens) + Cohere rerank.
      # Backup if OpenRouter sours: switch to Voyage by setting
      #   EMBEDDING_PROVIDER=voyage
      #   VOYAGE_MODEL=voyage-context-4     # $0.12/M after its 200M free tier
      #   EMBEDDING_DIMENSIONS=1024         # column width auto-migrates when table is empty
      # (VoyageEmbedder uses contextualized_embed, so only voyage-context-* models work.
      # Note context models re-embed the WHOLE document on any change: pricier under churn.)
      # Vectors across providers/models/dims are NOT comparable: a switch requires a
      # full re-index (the server detects drift via the stored embedding signature).
      - EMBEDDING_PROVIDER=openrouter
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_EMBED_MODEL=qwen/qwen3-embedding-8b
      # 2048 dims measured identical at the eval gate with half the storage;
      # deferred switch, see evals/README.md for the recipe
      - OPENROUTER_EMBED_DIMS=4096
      - EMBEDDING_DIMENSIONS=4096
      - POSTGRES_HOST=consulting-pgvector
      - POSTGRES_PORT=5432
      - POSTGRES_DB=consulting_graph
      - POSTGRES_USER=obsidian
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - CONSULTING_RERANK=1
      - RERANK_MODEL=cohere/rerank-v3.5
      - RERANK_POOL=50
      - CACHE_DIR=/home/mcpuser/.obsidian-graph/cache
      - CORPUS_SYNC_STATE_PATH=/home/mcpuser/.obsidian-graph/sync-state.json
      - CORPUS_HEALTH_MAX_AGE_SECONDS=120
    volumes:
      - "${CONSULTING_ROOT:-/Users/drewburchfield/dev/consulting}:/corpus:ro"
      - consulting-graph-cache:/home/mcpuser/.obsidian-graph
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-m", "src.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10m
    restart: unless-stopped

  consulting-pgvector:
    image: pgvector/pgvector:pg15
    container_name: consulting-graph-pgvector
    environment:
      - POSTGRES_DB=consulting_graph
      - POSTGRES_USER=obsidian
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5434:5432" # host 5434 -> container 5432 (vault stack uses its own network)
    volumes:
      - consulting-postgres-data:/var/lib/postgresql/data
      - ./src/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obsidian -d consulting_graph"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  default:
    name: consulting-graph-network

volumes:
  consulting-postgres-data:
  consulting-graph-cache:
